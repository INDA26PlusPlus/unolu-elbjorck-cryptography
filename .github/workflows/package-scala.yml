name: Manual Deployment
on: 
  workflow_dispatch:
    environment:
        description: 'SKibidi'
        type: environment
        required: true

jobs:
  create-release:
    runs-on: ubuntu-latest
    if: contains( github.event.head_commit.message, 'release' )
    steps:
     - name: Checkout Code
       uses: actions/checkout@v4
       with:
        ref: 'server'
      
     - name: CD to server
       run: cd server
      
     - name: Setup JDK
       uses: actions/setup-java@v4
       with:
         distribution: temurin
         java-version: 23 

     - name: Setup sbt launcher
       uses: sbt/setup-sbt@v1

     - name: Assemble fat jar 
       run: sbt assembly 

     - name: Release
       uses: softprops/action-gh-release@v3
       with:
        body: "Create fat jar for java to run"
        files: out/jvm/scala-3.10.0/server/server-assembly-0.1.0-SNAPSHOT.jar 
